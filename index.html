<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Treino em Casa</title>
    
    <!-- Ícones FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Seu CSS Personalizado e Compilado do Tailwind -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
<header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-white"><i class="fa-solid fa-dumbbell text-brand mr-2"></i>Evolução de Treino</h1>
                <p class="text-gray-400 text-sm mt-1" id="statusText">Conectando à nuvem...</p>
            </div>
            <div class="flex gap-4">
                <a href="historico.html" class="text-brand hover:text-brandHover text-sm font-medium transition-colors flex items-center">
                    <i class="fa-regular fa-calendar-check mr-1"></i> Histórico
                </a>
                <button onclick="resetData()" class="text-gray-500 hover:text-red-500 text-sm transition-colors" title="Apagar todos os dados">
                    <i class="fa-solid fa-rotate-right"></i> Resetar
                </button>
            </div>
        </header>

        <div class="flex overflow-x-auto scrollbar-hide space-x-2 mb-6 pb-2" id="daysContainer"></div>

        <div class="bg-card rounded-xl p-4 md:p-6 shadow-lg border border-gray-800 relative">
            
            <div id="loadingOverlay" class="absolute inset-0 bg-card/80 flex items-center justify-center z-10 rounded-xl">
                <i class="fa-solid fa-circle-notch fa-spin text-brand text-3xl"></i>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <h2 class="text-xl font-semibold text-white" id="currentDayTitle">Carregando...</h2>
                <div class="flex gap-2 w-full sm:w-auto">
                    <!-- NOVO BOTÃO DE CONCLUIR TREINO -->
                    <button onclick="finishTodayWorkout()" class="flex-1 sm:flex-none bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        <i class="fa-solid fa-check mr-1"></i> Concluir Treino
                    </button>
                    <button onclick="openAddModal()" class="flex-1 sm:flex-none bg-brand hover:bg-brandHover text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        <i class="fa-solid fa-plus mr-1"></i> Adicionar
                    </button>
                </div>
            </div>

            <!-- Tabela de Musculação -->
            <div class="overflow-x-auto" id="strengthSection">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="pb-3 font-medium">Exercício</th>
                            <th class="pb-3 font-medium text-center">Séries</th>
                            <th class="pb-3 font-medium text-center">Reps</th>
                            <th class="pb-3 font-medium text-center">Peso (kg)</th>
                            <th class="pb-3 font-medium text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="exerciseList"></tbody>
                </table>
            </div>
            
            <!-- Seção de Cardio (Fica embaixo) -->
            <div id="cardioSection" class="mt-8 pt-6 border-t border-gray-800 hidden">
                <h3 class="text-lg font-semibold text-white mb-4"><i class="fa-solid fa-heart-pulse text-red-500 mr-2"></i>Cardio</h3>
                <div id="cardioList" class="grid gap-3">
                    <!-- Cards de cardio gerados via JS -->
                </div>
            </div>

            <div id="emptyState" class="hidden text-center py-10">
                <i class="fa-solid fa-folder-open text-4xl text-gray-600 mb-3"></i>
                <p class="text-gray-400">Nenhum exercício para este dia.</p>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar/Editar -->
    <div id="formModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="bg-card w-full max-w-md rounded-xl p-6 border border-gray-800">
            <h3 class="text-xl font-bold text-white mb-4" id="modalTitle">Adicionar Exercício</h3>
            <input type="hidden" id="editId">
            
            <!-- Escolha do Tipo -->
            <div class="flex gap-6 mb-4 border-b border-gray-800 pb-4">
                <label class="flex items-center text-gray-300 cursor-pointer hover:text-white">
                    <input type="radio" name="exType" value="strength" class="mr-2 accent-brand" checked onclick="toggleType()"> Musculação
                </label>
                <label class="flex items-center text-gray-300 cursor-pointer hover:text-white">
                    <input type="radio" name="exType" value="cardio" class="mr-2 accent-red-500" onclick="toggleType()"> Cardio
                </label>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Nome do Exercício / Máquina</label>
                    <input type="text" id="exName" class="w-full bg-dark border border-gray-700 rounded-lg px-4 py-2 text-white">
                </div>

                <!-- Campos de Musculação -->
                <div id="strengthFields" class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Séries</label>
                        <input type="number" id="exSets" class="w-full bg-dark border border-gray-700 rounded-lg px-4 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Repetições</label>
                        <input type="number" id="exReps" class="w-full bg-dark border border-gray-700 rounded-lg px-4 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Peso (kg)</label>
                        <input type="number" step="0.5" id="exWeight" class="w-full bg-dark border border-gray-700 rounded-lg px-4 py-2 text-white">
                    </div>
                </div>

                <!-- Campos de Cardio -->
                <div id="cardioFields" class="hidden grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Dist. (km)</label>
                        <input type="number" step="0.1" id="exDistance" class="w-full bg-dark border border-gray-700 rounded-lg px-4 py-2 text-white" placeholder="Ex: 5">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Tempo (min)</label>
                        <input type="number" id="exTime" class="w-full bg-dark border border-gray-700 rounded-lg px-4 py-2 text-white" placeholder="Ex: 20">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Ritmo</label>
                        <select id="exPace" class="w-full bg-dark border border-gray-700 rounded-lg px-2 py-2 text-white">
                            <option value="Leve">Leve</option>
                            <option value="Moderado">Moderado</option>
                            <option value="Intenso">Intenso</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-end gap-3 mt-6 border-t border-gray-800 pt-4">
                <button onclick="closeModals()" class="px-4 py-2 text-gray-400 hover:text-white transition-colors">Cancelar</button>
                <button onclick="saveExercise()" class="bg-brand hover:bg-brandHover text-white px-6 py-2 rounded-lg font-medium">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Execução do YouTube / Carrossel -->
    <div id="mediaModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4">
        <div class="bg-card w-full max-w-lg rounded-xl p-6 border border-gray-800 relative">
            <button onclick="closeModals()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-bold text-white mb-2" id="mediaTitle">Execução</h3>
            <div class="carousel-container mb-6 border border-gray-700">
                <button class="carousel-btn prev" onclick="moveSlide(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carousel-slide active"><img src="https://placehold.co/600x400/121214/8257E5/png?text=Fase+1:+Posicao+Inicial"></div>
                <div class="carousel-slide"><img src="https://placehold.co/600x400/121214/8257E5/png?text=Fase+2:+Descida"></div>
                <div class="carousel-slide"><img src="https://placehold.co/600x400/121214/8257E5/png?text=Fase+3:+Subida"></div>
                <button class="carousel-btn next" onclick="moveSlide(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <a href="#" id="youtubeBtn" target="_blank" class="w-full flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-medium">
                <i class="fa-brands fa-youtube text-xl"></i> Ver Vídeo Completo
            </a>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
